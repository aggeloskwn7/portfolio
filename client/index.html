    <title>Aggelos Kwn - Portfolio </title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx?v=2104"></script>
    
    <script>

      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(registrations) {
          for(let registration of registrations) {
            registration.unregister();
            console.log('Service worker unregistered:', registration);
          }
        });
      }

      if ('caches' in window) {
        caches.keys().then(function(cacheNames) {
          cacheNames.forEach(function(cacheName) {
            caches.delete(cacheName);
            console.log('Cache cleared:', cacheName);
          });
        });
      }

      localStorage.setItem('lastLoadTime', Date.now().toString());

      const lastVisit = localStorage.getItem('lastVisitTimestamp');
      const now = Date.now();
      localStorage.setItem('lastVisitTimestamp', now.toString());

      if (lastVisit && (now - parseInt(lastVisit)) > 60 * 60 * 1000) {

        if (Math.random() < 0.1) {
          window.location.reload(true);
        }
      }
    </script>
  </body>
</html>
